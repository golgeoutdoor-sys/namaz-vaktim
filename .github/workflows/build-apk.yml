name: Namaz Vaktim APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını bul
        run: |
          ZIP="NamazVaktim_1.5.0_FINAL_5_GOREV_DUZELTILMIS.zip"

          echo "Aranan ZIP:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: $ZIP bulunamadı!"
            echo ""
            echo "Repository içindeki ZIP dosyaları:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP bulundu."

      - name: Projeyi ZIP'ten çıkar
        run: |
          rm -rf project
          mkdir -p project

          unzip -q \
            "NamazVaktim_1.5.0_FINAL_5_GOREV_DUZELTILMIS.zip" \
            -d project

          echo "ZIP içeriği:"
          find project -maxdepth 3 -type f | head -100

      - name: Android projesini bul
        run: |
          echo "Android proje dosyaları aranıyor..."

          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı!"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android projesi:"
          echo "$PROJECT_DIR"

      - name: Proje yapısını kontrol et
        run: |
          cd "$ANDROID_PROJECT_DIR"

          echo "Proje klasörü:"
          pwd

          echo ""
          echo "Dosyalar:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "settings.gradle:"
          ls -l settings.gradle* 2>/dev/null || true

          echo ""
          echo "build.gradle:"
          ls -l build.gradle* 2>/dev/null || true

          echo ""
          echo "app klasörü:"
          ls -la app 2>/dev/null || true

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarını kabul et
        run: |
          yes | sdkmanager --licenses || true

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper kontrol et
        run: |
          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper bulundu."
            ./gradlew --version
          else
            echo "Gradle Wrapper bulunamadı."
            echo "Sistemdeki Gradle kullanılacak."
            gradle --version
          fi

      - name: APK oluştur
        run: |
          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: APK dosyasını bul
        run: |
          echo "Oluşturulan APK dosyaları:"

          find "$ANDROID_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$ANDROID_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı!"
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
