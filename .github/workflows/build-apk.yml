name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Doğru ZIP dosyasını kontrol et
        run: |
          ZIP="NamazVaktim_1.4.0_TAM_SURUM_DUZELTILMIS_ANDROID (1).zip"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: $ZIP bulunamadı."
            echo "Repository'deki ZIP dosyaları:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Kullanılacak ZIP:"
          echo "$ZIP"

      - name: Projeyi ZIP'ten çıkar
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "NamazVaktim_1.4.0_TAM_SURUM_DUZELTILMIS_ANDROID (1).zip" -d project

      - name: Android projesini kontrol et
        run: |
          echo "ZIP içeriği:"
          find project -maxdepth 3 -type f | sort

          if [ ! -f "project/settings.gradle" ]; then
            echo "HATA: settings.gradle bulunamadı!"
            exit 1
          fi

          if [ ! -f "project/app/build.gradle" ]; then
            echo "HATA: app/build.gradle bulunamadı!"
            exit 1
          fi

          echo "Android projesi doğru."

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK oluştur
        working-directory: project
        run: |
          gradle assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-1.4.0-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
