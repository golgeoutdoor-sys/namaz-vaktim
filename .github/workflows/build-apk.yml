name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Güncel ZIP dosyasını bul
        id: findzip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | sort -V | tail -n 1)
          echo "Kullanılacak ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Projeyi ZIP'ten çıkar
        run: |
          mkdir -p project
          unzip -o "${{ steps.findzip.outputs.zip }}" -d project

      - name: Proje klasörünü bul
        run: |
          echo "ZIP içeriği:"
          find project -maxdepth 5 -type f | sort

      - name: Android projesinin kökünü bul
        run: |
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-1.4.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
