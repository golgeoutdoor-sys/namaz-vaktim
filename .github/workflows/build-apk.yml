name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Güncel ZIP dosyasını bul
        id: findzip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print | sort | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Kullanılacak ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Projeyi ZIP'ten çıkar
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "${{ steps.findzip.outputs.zip }}" -d project

      - name: Android projesinin kökünü bul
        id: findproject
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android proje kökü: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK oluştur
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
