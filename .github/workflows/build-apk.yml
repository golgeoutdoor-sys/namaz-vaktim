name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Güncel ZIP dosyasını bul
        id: findzip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print | sort | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Kullanılacak ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Projeyi ZIP'ten çıkar
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "${{ steps.findzip.outputs.zip }}" -d project

      - name: Flutter projesini bul
        id: findflutter
        shell: bash
        run: |
          PUBSPEC=$(find project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "HATA: pubspec.yaml bulunamadı."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          FLUTTER_DIR=$(dirname "$PUBSPEC")

          echo "Flutter proje kökü: $FLUTTER_DIR"
          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümünü göster
        run: flutter --version

      - name: Paketleri yükle
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter pub get

      - name: APK oluştur
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter build apk --release

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-1.4.0-APK
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/app-release.apk
