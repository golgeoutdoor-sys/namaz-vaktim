name: Namaz Vaktim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          echo "Repository içindeki ZIP dosyaları:"
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | grep -Ei 'FINAL|GOREV|ANDROID|DUZELTILMIS|GUNCEL|SURUM' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Uygun Android ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Kullanılacak ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Projeyi ZIP'ten çıkar
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "ZIP içeriği:"
          find project -maxdepth 3 -type f | head -100

      - name: Android projesini bul
        shell: bash
        run: |
          GRADLE_FILE=$(find project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "settings.gradle bulunamadı."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Android proje klasörü:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: MainActivity dosyasını bul
        shell: bash
        run: |
          MAIN_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.java bulunamadı."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

      - name: AndroidX ayarlarını yap
        shell: bash
        run: |
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX ayarları:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: MainActivity ticker hatasını kontrol et
        shell: bash
        run: |
          python3 <<'PY'
          import os

          file = os.environ["MAIN_FILE"]

          with open(file, "r", encoding="utf-8") as f:
              text = f.read()

          old = """final Runnable ticker=()->{ updateCountdown(); handler.postDelayed(ticker,1000); };"""

          new = """final Runnable[] ticker = new Runnable[1];
          ticker[0] = () -> {
              updateCountdown();
              handler.postDelayed(ticker[0], 1000);
          };"""

          if old in text:
              text = text.replace(old, new)
              print("Ticker hatası düzeltildi.")
          else:
              print("Ticker eski biçimde bulunamadı. Değişiklik yapılmadı.")

          with open(file, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9.1 kur
        shell: bash
        run: |
          echo "Gradle 8.9.1 kuruluyor..."

          mkdir -p "$HOME/gradle"

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9.1-bin.zip \
            -O "$HOME/gradle/gradle.zip"

          unzip -q \
            "$HOME/gradle/gradle.zip" \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.9.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Gradle wrapper ayarla
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Gradle wrapper 8.9.1 olarak ayarlanıyor..."

          gradle wrapper \
            --gradle-version 8.9.1 \
            --distribution-type bin

          chmod +x ./gradlew

          ./gradlew --version

      - name: Android bağımlılıklarını kontrol et
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew \
            app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon

      - name: Gradle ile APK oluştur
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK dosyasını bul
        shell: bash
        run: |
          echo "APK dosyaları:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK bulunamadı!"
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK_FILE"

          cp "$APK_FILE" "./NamazVaktim.apk"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NamazVaktim-APK
          path: NamazVaktim.apk
          if-no-files-found: error
          retention-days: 30
