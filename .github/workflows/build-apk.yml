name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4


      - name: Doğru Android ZIP dosyasını bul
        shell: bash
        run: |
          echo "Repository'deki ZIP dosyaları:"
          find . -maxdepth 1 -type f -iname "*.zip" -printf "%f\n" | sort

          echo ""
          echo "Düzeltilmiş Android ZIP aranıyor..."

          ZIP=$(find . -maxdepth 1 -type f \
            -iname "*DUZELTILMIS_ANDROID*.zip" \
            -print | sort -r | head -n 1)

          if [ -z "$ZIP" ]; then
            echo ""
            echo "HATA: DUZELTILMIS_ANDROID ZIP bulunamadı."
            echo ""
            echo "Mevcut ZIP dosyaları:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "KULLANILACAK ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      - name: Projeyi ZIP'ten çıkar
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "ZIP açılıyor:"
          echo "$ZIP"

          unzip -o "$ZIP" -d project

          echo ""
          echo "ZIP içeriği:"
          find project -maxdepth 6 -type f | sort | head -250


      - name: Android projesini bul
        shell: bash
        run: |
          echo "settings.gradle aranıyor..."

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "HATA: Android projesi bulunamadı."
            echo ""
            echo "settings.gradle dosyaları:"
            find project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print

            echo ""
            echo "Project içeriği:"
            find project -maxdepth 8 -type f | sort | head -300

            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "ANDROID PROJE KÖKÜ:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      - name: MainActivity dosyasını bul
        shell: bash
        run: |
          MAIN=$(find "$PROJECT_ROOT" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          if [ -z "$MAIN" ]; then
            echo ""
            echo "HATA: MainActivity.java bulunamadı."
            exit 1
          fi

          echo ""
          echo "MAIN ACTIVITY:"
          echo "$MAIN"

          echo "MAIN_ACTIVITY=$MAIN" >> "$GITHUB_ENV"


      - name: MainActivity ticker hatasını düzelt
        shell: bash
        run: |
          echo "MainActivity düzeltiliyor..."

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = re.compile(
              r'final\s+Runnable\s+ticker\s*=\s*\(\)\s*->\s*\{\s*'
              r'updateCountdown\s*\(\s*\)\s*;\s*'
              r'handler\.postDelayed\s*\(\s*ticker\s*,\s*1000\s*\)\s*;\s*'
              r'\}\s*;',
              re.MULTILINE
          )

          replacement = """final Runnable ticker = new Runnable() {
              @Override
              public void run() {
                  updateCountdown();
                  handler.postDelayed(this, 1000);
              }
          };"""

          text, count = pattern.subn(
              replacement,
              text,
              count=1
          )

          if count:
              print("Ticker hatası bulundu ve düzeltildi.")
          else:
              print("Ticker eski biçimde bulunamadı.")
              print("Kod zaten düzeltilmiş olabilir.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo ""
          echo "Ticker kontrolü:"
          grep -n -A10 -B3 "Runnable ticker" "$MAIN_ACTIVITY" || true


      - name: Java kodunu kontrol et
        shell: bash
        run: |
          echo "Java kodu kontrol ediliyor..."

          if grep -q 'handler.postDelayed(ticker' "$MAIN_ACTIVITY"; then
            echo ""
            echo "HATA: Eski ticker kullanımı hâlâ mevcut."
            exit 1
          fi

          echo ""
          echo "Java kontrolü başarılı."


      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Android SDK kur
        uses: android-actions/setup-android@v3


      - name: Gradle ile APK oluştur
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          echo "Android proje:"
          pwd

          echo ""
          echo "Proje dosyaları:"
          ls -la

          echo ""
          echo "Gradle başlatılıyor..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "gradlew bulunamadı."
            echo "Sistem Gradle kullanılacak."

            gradle assembleDebug --no-daemon
          fi


      - name: APK dosyasını bul
        shell: bash
        run: |
          echo "APK aranıyor..."

          find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "HATA: APK bulunamadı."
            exit 1
          fi

          echo ""
          echo "APK bulundu:"
          echo "$APK"

          mkdir -p output

          cp "$APK" output/NamazVaktim.apk


      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NamazVaktim-APK
          path: output/NamazVaktim.apk
          if-no-files-found: error
