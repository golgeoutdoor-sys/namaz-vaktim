name: Namaz Vaktim APK

on:
  push:
    paths:
      - "NamazVaktim_1.4.0_TAM_SURUM_GUNCEL.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Projeyi ZIP'ten çıkar
        run: |
          mkdir -p project
          unzip -o "NamazVaktim_1.4.0_TAM_SURUM_GUNCEL.zip" -d project

      - name: Proje klasörünü kontrol et
        run: |
          echo "ZIP içeriği:"
          find project -maxdepth 3 -type f | sort

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK oluştur
        working-directory: project
        run: |
          gradle assembleDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Vaktim-1.4.0-APK
          path: project/app/build/outputs/apk/debug/*.apk
