name: Namaz Vaktim APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını otomatik bul
        shell: bash
        run: |
          echo "Repository'deki ZIP dosyaları:"
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP=$(find . -maxdepth 1 -type f -iname "*DUZELTILMIS*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "DUZELTILMIS ZIP bulunamadı. Tüm ZIP dosyaları:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Kullanılacak ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Projeyi ZIP'ten çıkar
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "ZIP açılıyor:"
          echo "$ZIP"

          unzip -o "$ZIP" -d project

          echo "ZIP içeriği:"
          find project -maxdepth 5 -type f | head -100

      - name: Android projesini otomatik bul
        shell: bash
        run: |
          echo "settings.gradle dosyaları aranıyor..."

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle bulunamadı."
            find project -maxdepth 8 -type f | sort | head -200
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android/Gradle proje kökü:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle ile APK oluştur
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          echo "Gradle projesi:"
          pwd

          echo "Dosyalar:"
          ls -la

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: APK dosyasını bul
        shell: bash
        run: |
          echo "APK dosyaları:"
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_ROOT" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "Bulunan APK:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/NamazVaktim.apk

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NamazVaktim-APK
          path: output/NamazVaktim.apk
          if-no-files-found: error
