name: Namaz Vaktim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: AndroidX kontrolü
        shell: bash
        run: |
          set -e

          test -f gradle.properties

          grep -Fq 'android.useAndroidX=true' gradle.properties
          grep -Fq 'android.enableJetifier=true' gradle.properties

          echo "AndroidX OK"

      - name: Proje dosyalarını kontrol et
        shell: bash
        run: |
          set -e

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/namazvaktim/app/MainActivity.java

          echo "Android proje dosyalari OK"

      - name: Güncellemeleri kaynak kodda kontrol et
        shell: bash
        run: |
          set -e

          MAIN="app/src/main/java/com/namazvaktim/app/MainActivity.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          FILE_PATHS="app/src/main/res/xml/file_paths.xml"

          echo "======================================"
          echo "GUNCELLEMELER KONTROL EDILIYOR"
          echo "======================================"

          echo ""
          echo "1 - KIBLE PUSULASI"

          grep -Fq 'qiblaBearing' "$MAIN"
          grep -Fq 'TYPE_ROTATION_VECTOR' "$MAIN"
          grep -Fq 'qiblaArrow' "$MAIN"

          echo "OK - Kible pusulasi bulundu"

          echo ""
          echo "2 - KURAN ZOOM"

          grep -Fq 'setSupportZoom(true)' "$MAIN"
          grep -Fq 'setBuiltInZoomControls(true)' "$MAIN"
          grep -Fq 'setLoadWithOverviewMode(true)' "$MAIN"
          grep -Fq 'setUseWideViewPort(true)' "$MAIN"

          echo "OK - Kuran zoom bulundu"

          echo ""
          echo "3 - TEMA SISTEMI"

          grep -Fq 'PREF_THEME' "$MAIN"
          grep -Fq 'showThemeDialog' "$MAIN"
          grep -Fq 'applyThemeToTree' "$MAIN"

          echo "OK - Tema sistemi bulundu"

          echo ""
          echo "4 - SABAH NAMAZI"

          grep -Fq 'String[] n={"Sabah","Güneş","Öğle","İkindi","Akşam","Yatsı"}' "$MAIN"

          echo "OK - Sabah namazi bulundu"

          echo ""
          echo "5 - AYET PAYLASIMI"

          grep -Fq 'shareAyetData' "$MAIN"
          grep -Fq 'Bitmap.CompressFormat.PNG' "$MAIN"
          grep -Fq 'turkish_meaning' "$MAIN"
          grep -Fq 'FileProvider.getUriForFile' "$MAIN"

          echo "OK - Ayet paylasimi bulundu"

          echo ""
          echo "6 - FILEPROVIDER"

          test -f "$FILE_PATHS"
          grep -Fq 'cache-path' "$FILE_PATHS"
          grep -Fq 'androidx.core.content.FileProvider' "$MANIFEST"

          echo "OK - FileProvider bulundu"

          echo ""
          echo "======================================"
          echo "TUM GUNCELLEMELER KAYNAK KODDA BULUNDU"
          echo "======================================"

      - name: APK oluştur
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK bulunamadi."
            exit 1
          fi

          echo "======================================"
          echo "APK BASARIYLA OLUSTURULDU"
          echo "======================================"

          ls -lh "$APK"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NamazVaktim-1.5.0-guncel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
