name: Namaz Vaktim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK bileşenlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          echo "ZIP dosyaları:"
          find . -maxdepth 1 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "*FINAL*5*GOREV*DUZELTILMIS*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Düzeltilmiş ZIP bulunamadı."
            exit 1
          fi

          echo "Kullanılacak ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Projeyi ZIP'ten çıkar
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Proje dosyaları:"
          find project -maxdepth 3 -type f | head -100

      - name: Android projesini bul
        shell: bash
        run: |
          echo "settings.gradle:"
          find project -name "settings.gradle" -o -name "settings.gradle.kts"

          echo "build.gradle:"
          find project -name "build.gradle" -o -name "build.gradle.kts"

      - name: AndroidX ayarlarını yap
        shell: bash
        run: |
          echo "AndroidX etkinleştiriliyor..."

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "gradle.properties:"
          cat project/gradle.properties

      - name: MainActivity kontrolü
        shell: bash
        run: |
          echo "MainActivity aranıyor..."

          MAIN_FILE=$(find project -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_FILE" ]; then
            echo "HATA: MainActivity.java bulunamadı."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_FILE"

          grep -n "final Runnable ticker" "$MAIN_FILE" || true

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Gradle sürümünü kontrol et
        working-directory: project
        run: |
          gradle --version

      - name: Android bağımlılıklarını kontrol et
        working-directory: project
        run: |
          gradle :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon

      - name: APK oluştur
        working-directory: project
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          APK_FILE="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "APK başarıyla oluşturuldu:"
          ls -lh "$APK_FILE"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: NamazVaktim-1.5.0-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
